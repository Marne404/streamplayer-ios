# Etappe 0: baut die iPad-Test-App ohne Mac und veröffentlicht sie als SideStore-Quelle.
#   .ipa (unsigniert)  → GitHub Release spike-<Laufnummer>
#   source.json + Testseite → GitHub Pages (https://marne404.github.io/streamplayer-ios/)
# SideStore signiert die App beim Installieren selbst mit der Apple-ID des Nutzers.
name: iPad-Test-App

on:
  push:
    branches: [main]
    paths:
      - 'ios-spike/**'
      - '.github/workflows/ios-spike.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ios-spike
  cancel-in-progress: true

env:
  BUILD: ${{ github.run_number }}
  VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Kotlin/Native-Werkzeuge zwischenspeichern
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: konan-${{ runner.os }}-${{ hashFiles('ios-spike/**/*.gradle.kts', 'ios-spike/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Werkzeuge
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: ios-spike/iosApp
        run: xcodegen generate

      - name: App bauen (unsigniert)
        working-directory: ios-spike/iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            build 2>&1 | tee build.log | grep -E '(error|warning: .*Kotlin|BUILD (SUCCEEDED|FAILED)|\*\* )' || true
          test -d build/Build/Products/Release-iphoneos/StreamplayerSpike.app || { tail -n 150 build.log; exit 1; }

      - name: IPA packen
        working-directory: ios-spike/iosApp
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StreamplayerSpike.app Payload/
          zip -qry ../../StreamplayerSpike.ipa Payload
          ls -la ../../StreamplayerSpike.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :CFBundleIdentifier' Payload/StreamplayerSpike.app/Info.plist

      - name: Build-Protokoll sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ios-spike/iosApp/build.log
          if-no-files-found: ignore

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "spike-$BUILD" StreamplayerSpike.ipa \
            --title "iPad-Test $VERSION" \
            --notes "Etappe 0, gebaut aus ${GITHUB_SHA::7}. Installation über SideStore." \
            --latest

      - name: SideStore-Quelle und Testseite
        run: |
          mkdir -p _site
          cp -R ios-spike/pages/. _site/
          python3 - <<'PY'
          import json, os, datetime
          base = "https://marne404.github.io/streamplayer-ios/"
          build = os.environ["BUILD"]; version = os.environ["VERSION"]
          size = os.path.getsize("StreamplayerSpike.ipa")
          source = {
            "name": "Streamplayer iPad-Test",
            "identifier": "io.github.marne404.streamplayer-ios",
            "sourceURL": base + "source.json",
            "iconURL": base + "icon.png",
            "website": base,
            "tintColor": "#8E6F43",
            "apps": [{
              "name": "SP Test",
              "bundleIdentifier": "de.marne.streamplayer.spike",
              "developerName": "Marne",
              "subtitle": "Streamplayer – Etappe 0",
              "localizedDescription": "Test-App: Ivory & Ink in Compose Multiplatform, AVPlayer mit Referer und Bild im Bild, Erkennung mit detect.js.",
              "iconURL": base + "icon.png",
              "tintColor": "#8E6F43",
              "versions": [{
                "version": version,
                "buildVersion": build,
                "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                "size": size,
                "downloadURL": f"https://github.com/Marne404/streamplayer-ios/releases/download/spike-{build}/StreamplayerSpike.ipa",
                "minOSVersion": "17.0",
                "localizedDescription": f"Build {build}"
              }],
              "appPermissions": {"entitlements": [], "privacy": {}}
            }],
            "news": []
          }
          json.dump(source, open("_site/source.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps(source["apps"][0]["versions"][0], indent=2))
          PY

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
