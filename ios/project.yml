# iPad-App „Streamplayer“: XcodeGen-Hülle um das Kotlin-Framework aus :ui (Compose Multiplatform).
# Das .xcodeproj entsteht erst im CI (xcodegen generate) – gebaut wird ohne Mac auf GitHub Actions.
name: Streamplayer
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Streamplayer:
    type: application
    platform: iOS
    sources:
      - iosApp
    scheme: {}
    preBuildScripts:
      - name: Kotlin-Framework bauen
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew --no-daemon :ui:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_NAME: Streamplayer
        PRODUCT_BUNDLE_IDENTIFIER: de.marne.streamplayer.ipad
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Streamplayer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Zugang zum Konto – beim Bauen aus Geheimnissen des Build-Repos (leer: nur Beispieltitel).
        SPGoogleClientId: $(SP_GOOGLE_CLIENT_ID)
        SPFirebaseApiKey: $(SP_FIREBASE_API_KEY)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
