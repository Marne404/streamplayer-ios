<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erkennungstest</title>
<style>
  :root { --bg:#F4F1EA; --surface:#FBF9F5; --line:#E0D9CC; --text:#1B1A17; --muted:#6B655B; --brass:#8E6F43; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121110; --surface:#1A1917; --line:#2F2C27; --text:#EDE8DF; --muted:#A59E92; --brass:#C9AB7A; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, system-ui, sans-serif; }
  h1 { font:600 22px/1.2 Georgia, serif; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 14px; }
  .box { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .label { font-size:11px; letter-spacing:1.4px; color:var(--brass); text-transform:uppercase; margin-bottom:6px; }
  video, iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000; display:block; }
  #fetch { font-family: ui-monospace, monospace; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <h1>Erkennungstest</h1>
  <p>Drei Wege, auf denen detect.js Videos findet. Alles Apples öffentliche HLS-Beispiele.</p>

  <div class="box">
    <div class="label">1 · &lt;video&gt; in der Seite</div>
    <video controls playsinline muted preload="metadata"
      src="https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"></video>
  </div>

  <div class="box">
    <div class="label">2 · Video in einem eingebetteten Frame</div>
    <iframe src="frame.html" title="Eingebetteter Player"></iframe>
  </div>

  <div class="box">
    <div class="label">3 · Playlist per fetch() geladen</div>
    <div id="fetch">lädt …</div>
  </div>

<script>
  fetch('https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_adv_example_hevc/master.m3u8')
    .then(function (r) { document.getElementById('fetch').textContent = 'HTTP ' + r.status + ' · ' + r.headers.get('content-type'); return r.text(); })
    .catch(function (e) { document.getElementById('fetch').textContent = 'Fehler: ' + e; });
</script>
</body>
</html>
